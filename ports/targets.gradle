ext.requireMotionCuesTarget = { boolean modern ->
    String minecraftVersion =
            providers.gradleProperty('mcVersion').orNull
    if (minecraftVersion == null) {
        throw new GradleException(
                'Pass the target with -PmcVersion=<version>.')
    }
    Map target = motionCuesTargets[minecraftVersion]
    if (target == null) {
        throw new GradleException(
                "Unsupported Motion Cues target: ${minecraftVersion}")
    }
    boolean isModern = minecraftVersion.startsWith('26.')
    if (isModern != modern) {
        throw new GradleException(
                "${minecraftVersion} belongs to the "
                        + (isModern ? 'modern' : 'legacy')
                        + ' build.')
    }
    return [minecraftVersion: minecraftVersion] + target
}
